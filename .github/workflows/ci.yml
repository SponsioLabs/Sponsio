name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core package
        run: pip install -e .

      - name: Install test + integration dependencies
        run: |
          pip install pytest pytest-cov langgraph langchain-core fastapi pydantic uvicorn python-multipart httpx opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http cryptography
          pip install claude-agent-sdk vercel-ai-sdk || echo "Optional SDK install failed (platform-specific), tests will skip"

      # Build the canonical OpenClaw plugin TS so the
      # ``test_openclaw_artifact_sync`` invariant test (compares
      # ``plugins/sponsio-openclaw/dist/`` byte-for-byte against the
      # wheel-bundled ``sponsio/plugin/openclaw_artifact/dist/``) has
      # both copies on disk. ``npm ci`` pins to the exact lockfile
      # versions that produced the committed bundled artifact, so
      # bytes match.
      - name: Set up Node.js (for OpenClaw plugin build)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build OpenClaw plugin TS artifact
        working-directory: plugins/sponsio-openclaw
        run: npm ci && npm run build

      - name: Run tests
        run: pytest --cov=sponsio --cov-report=term-missing -v

      - name: Test OpenClaw plugin against the daemon
        # The end-to-end cases fail rather than skip when CI is set and
        # SPONSIO_TEST_PYTHON is missing or cannot import sponsio.
        if: matrix.python-version == '3.12'
        working-directory: plugins/sponsio-openclaw
        run: SPONSIO_TEST_PYTHON="$(command -v python)" npm test

  tier2:
    name: Tier 2 (system install, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The engine is built on the root-owned system interpreter; a
      # setup-python install under the runner's home would not count.
      - name: System Python with venv
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv
          /usr/bin/python3 --version

      - name: Sources every user can read
        run: |
          cp -r "$GITHUB_WORKSPACE" /tmp/src
          chmod -R a+rX /tmp/src

      - name: The operator's CLI
        run: |
          /usr/bin/python3 -m venv /tmp/operator
          /tmp/operator/bin/pip install --quiet /tmp/src

      # The runner image leaves some shared directories writable by other
      # users; the installer refuses those, as it should on any machine,
      # and the operator fixes them first.
      - name: Shared parent directories as an operator would leave them
        run: |
          for d in /opt /usr/local /usr/local/libexec /var/lib /var/log /run; do
            if [ -d "$d" ]; then sudo chown root:root "$d" && sudo chmod go-w "$d"; fi
          done

      - name: sudo sponsio install --system
        run: |
          sudo /tmp/operator/bin/sponsio install --system \
            --python /usr/bin/python3 --package "/tmp/src[signing]" --no-migrate

      - name: An unprivileged agent user
        run: |
          sudo useradd --create-home agentuser
          sudo -u agentuser /usr/bin/python3 -m venv /home/agentuser/venv
          # Built here: the agent user cannot write into /tmp/src.
          /tmp/operator/bin/pip wheel --quiet --no-deps -w /tmp/wheels /tmp/src
          chmod -R a+rX /tmp/wheels
          sudo -u agentuser /home/agentuser/venv/bin/pip install --quiet /tmp/wheels/*.whl pytest

      - name: Tier 2 from the agent's side
        working-directory: /tmp/src
        run: |
          sudo -u agentuser env SPONSIO_TEST_TIER=2 HOME=/home/agentuser \
            /home/agentuser/venv/bin/python -m pytest -v -p no:cacheprovider \
            tests/test_tier2_live.py

      # The corpus runs as the operator, who can prepare rules through the
      # admin socket (sudo); every agent-side step runs as agentuser
      # through `sudo -u`. A missing install or privilege fails, not skips.
      - name: Boundary corpus, Tier 2 (agent is agentuser)
        working-directory: /tmp/src
        env:
          SPONSIO_TEST_TIER: "2"
          SPONSIO_TEST_AGENT_USER: agentuser
          SPONSIO_TEST_REQUIRE_SYSTEM: "1"
        run: |
          /tmp/operator/bin/pip install --quiet pytest
          /tmp/operator/bin/python -m pytest -v -rs -p no:cacheprovider \
            tests/security/test_system_sandbox.py tests/security/test_boundary_corpus.py

      - name: Daemon log
        if: failure()
        run: |
          sudo cat /var/log/sponsio/daemon.log || true
          sudo journalctl -u sponsio --no-pager | tail -50 || true

      - name: Uninstall leaves nothing behind
        run: |
          sudo /tmp/operator/bin/sponsio uninstall --system
          for p in /opt/sponsio /usr/local/libexec/sponsio /var/lib/sponsio \
                   /var/log/sponsio /run/sponsio /etc/systemd/system/sponsio.service \
                   /etc/claude-code/managed-settings.d/50-sponsio.json; do
            if sudo test -e "$p"; then echo "left behind: $p"; exit 1; fi
          done
          if id _sponsio 2>/dev/null; then echo "user _sponsio left behind"; exit 1; fi

  tier3:
    name: Tier 3 (sandbox, egress proxy, container recipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Ubuntu restricts unprivileged user namespaces through AppArmor;
      # bubblewrap needs them.
      - name: bubblewrap with user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install
        run: pip install -e . pytest

      - name: Sandbox, egress proxy and gateway, for real
        run: pytest -v tests/test_sandbox_run.py tests/test_egress.py tests/test_gateway.py

      # The boundary corpus at Tier 2 and 3 runs here or in a VM, never on
      # a developer machine.
      - name: Boundary corpus, Tier 3
        env:
          SPONSIO_TEST_TIER: "3"
        run: pytest -v -p no:cacheprovider tests/security/test_boundary_corpus.py

      - name: Container recipe
        working-directory: deploy/tier3
        env:
          SPONSIO_SPEC: "/src[signing]"
          SPONSIO_AGENT_SPEC: "/src"
        run: |
          docker compose up -d --build sponsiod
          for i in $(seq 1 30); do
            docker compose exec -T sponsiod test -S /run/sponsio/agent.sock && break
            sleep 1
          done
          out=$(docker compose run --rm -v "$PWD/probe.py:/probe.py:ro" agent python /probe.py)
          echo "$out"
          python3 - "$out" <<'PY'
          import json, sys
          r = json.loads(sys.argv[1].strip().splitlines()[-1])
          assert r["direct"].startswith("fail"), r
          assert r["allowed"] == 200, r
          assert r["refused"].startswith("refused") and "403" in r["refused"], r
          PY

      - name: Daemon log
        if: failure()
        working-directory: deploy/tier3
        run: docker compose logs sponsiod || true

  build-smoke-test:
    name: Build wheel + install smoke test
    runs-on: ubuntu-latest
    # Stand-in for the TestPyPI gate we used to keep in publish.yml.
    # `twine check` catches the same metadata regressions PyPI rejects on
    # upload (long-description content-type, classifier validity, etc.);
    # the install + `sponsio --version`/--help run catches packaging
    # errors (missing modules, broken entry point) that would brick the
    # wheel before we burn an immutable PyPI version number.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install built wheel + verify CLI
        # Install the freshly-built wheel into a clean venv (not editable)
        # so this catches packaging issues that `pip install -e .` skips —
        # e.g. missing files in `tool.setuptools.package-data`.
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/sponsio --version
          /tmp/smoke-venv/bin/sponsio --help
          # --version/--help are click-level and don't import yaml, so
          # they missed #61 (pyyaml mis-filed as optional). Assert the
          # core deps resolve, then run a command that actually reads the
          # bundled YAML so a missing core dependency fails the build.
          /tmp/smoke-venv/bin/python -c "import yaml"
          /tmp/smoke-venv/bin/sponsio packs

  test-typescript:
    name: Test (TypeScript — native)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install + Build TS workspace
        working-directory: ts
        # Use the root ``build`` script (which already passes
        # ``--if-present`` to ``npm run build --workspaces``) so the
        # example packages — which intentionally have no ``build``
        # script — don't fail the matrix.
        run: npm install && npm run build

      - name: Run cross-language tests
        working-directory: ts/packages/sdk
        # The package's own test command, which is the whole compiled
        # suite. This step ran only ``core.test.js`` — so the TS half of
        # ``tests/cross_language/scenarios.json`` was never replayed in
        # CI, and the shared file gated Python alone. A no_reversal
        # argument inversion in the TS nl-parser lived through that gap.
        run: npm test

      - name: Differential fuzz against the Python runtime
        # scenarios.json holds nine hand-written cases. Nine catches a
        # rewrite and not a drift: the no_reversal argument inversion
        # lived through that file for months. This generates rulebooks
        # and traces and asks both runtimes, step by step, whether the
        # call is allowed. A fixed seed so a red build is reproducible;
        # the sweep across many seeds is a local command.
        working-directory: .
        run: |
          pip install -e . --quiet
          python scripts/fuzz_cross_language.py --cases 400 --seed 20260907

      - name: Check the NL parser against Python's
        # scenarios.json covers the runtime; this covers the parser that
        # decides what the runtime is given. The two drifted a long way
        # apart unnoticed — Python at 24 keyword rules and 155 regexes,
        # TypeScript at 12 and 46 — because a TypeScript parser that
        # cannot read a rule returns null rather than failing, so a
        # rulebook armed 23 patterns in one runtime and 12 in the other
        # and neither said anything.
        working-directory: .
        run: node scripts/check_nl_parity.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff and dependencies
        # Ruff `format` rules change between minor versions; pin to the
        # same version pyproject.toml's `dev` extra declares so CI and
        # local always agree.
        run: pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check sponsio/ tests/ scripts/

      - name: Check linting
        run: ruff check sponsio/ tests/ scripts/

      - name: Check documentation links
        # Two files were renamed and ten references were not, including
        # the one on the docs home page that is its primary call to
        # action. Nothing in the build noticed.
        run: python scripts/check_doc_links.py

      - name: Check README/QUICKSTART command sync
        run: |
          # Canonical user-journey commands that must appear in user-facing
          # docs. Prevents CLI renames/drift from silently desyncing the
          # onboarding paths. README.md (the 60-second version) covers
          # install + entry point; QUICKSTART.md (the full walkthrough)
          # additionally covers report and the observe→enforce flip.
          readme_required=(
            "pip install --pre sponsio"
            "sponsio init"
          )
          quickstart_required=(
            "pip install --pre sponsio"
            "sponsio init"
            "sponsio report"
            "SPONSIO_MODE=enforce"
          )
          exit_code=0
          for cmd in "${readme_required[@]}"; do
            if ! grep -qF "$cmd" README.md; then
              echo "::error file=README.md::Canonical command missing: $cmd"
              exit_code=1
            fi
          done
          for cmd in "${quickstart_required[@]}"; do
            if ! grep -qF "$cmd" QUICKSTART.md; then
              echo "::error file=QUICKSTART.md::Canonical command missing: $cmd"
              exit_code=1
            fi
          done
          exit $exit_code

      - name: Check README header assets intact
        run: |
          # WYSIWYG markdown editors strip key README assets:
          #   - banner image markdown at top
          #   - architecture diagram reference in "How Sponsio works"
          #   - <p align="center"> wrappers around badges + paste-prompt buttons
          # Catch any of these going missing before push hits main.
          fail=0

          # Banner image markdown reference at top of README. Accepts both
          # the relative path (works on GitHub) and the absolute raw.gh
          # URL (also needed for PyPI README rendering, since PyPI does not
          # resolve relative paths).
          if ! grep -qE '!\[Sponsio\]\((assets/|https://raw\.githubusercontent\.com/[^)]+/assets/)readme-banner\.png\)' README.md; then
            echo "::error file=README.md::Banner image markdown missing. Re-add at the top of the file (relative 'assets/readme-banner.png' or absolute 'https://raw.githubusercontent.com/.../assets/readme-banner.png')."
            fail=1
          fi

          # Architecture diagram reference (anywhere in README)
          if ! grep -qE 'assets/sponsio-architecture\.png' README.md; then
            echo "::error file=README.md::Architecture diagram reference missing - 'assets/sponsio-architecture.png' was stripped. Re-add inside the 'How Sponsio works' section."
            fail=1
          fi

          # Centered HTML wrappers (utility badges + social badges + architecture diagram + paste-prompt buttons → 3 minimum)
          centered=$(grep -c '^<p align="center">' README.md || echo 0)
          min_centered=3
          if [ "$centered" -lt "$min_centered" ]; then
            echo "::error file=README.md::Expected at least ${min_centered} <p align=\"center\"> blocks, found ${centered}. WYSIWYG editor likely stripped them."
            fail=1
          fi

          # Asset files actually exist in the repo
          for f in assets/readme-banner.png assets/sponsio-architecture.png; do
            if [ ! -f "$f" ]; then
              echo "::error file=${f}::Image asset missing from repo."
              fail=1
            fi
          done

          [ "$fail" -eq 0 ]
